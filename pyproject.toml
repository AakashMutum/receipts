[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "receipts"
version = "1.0.2"
description = "Holds a moving business metric back, proves why it moved, and tells people and AI agents whether to trust it. Runs inside Exasol."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "pyexasol>=0.26",
  "duckdb>=1.1",
  "sqlglot>=26",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "numpy>=1.26",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "hypothesis>=6.100", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
receipts = "receipts.cli:main"

[tool.setuptools]
packages = ["receipts", "receipts.udf"]

[tool.setuptools.package-data]
receipts = ["sql/*.sql", "udf/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
include = ["receipts/**/*.py", "tests/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
# syntax errors and pyflakes only (unused imports, undefined names); no formatting rules
select = ["E9", "F"]
