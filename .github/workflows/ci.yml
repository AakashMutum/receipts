name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: receipts judge-check
      # The one-click scripts: syntax, then a real run of their setup steps (Python, .venv, install) with --check,
      # which stops before the server starts. Not run on Windows (run.bat is checked by tests/test_scripts.py only).
      - name: run scripts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n run.sh
          bash -n run.command
          bash -n run-exasol.sh
          bash -n run-exasol.command
          ./run.sh --check
          bash ./run.command --check
