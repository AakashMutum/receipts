name: exasol
# Receipts against a real Exasol database: the exasol/docker-db image on the hosted Ubuntu runner.
# Separate from the three-system test matrix in ci.yml, which does not wait for it.
on:
  push:
    branches: [main, ci-exasol]
  workflow_dispatch:
jobs:
  live-exasol:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RECEIPTS_BACKEND: exasol
      EXA_DSN: localhost:8563
      EXA_USER: sys
      EXA_PASSWORD: exasol      # the image's documented default, for a throwaway database on the runner
      EXA_INSECURE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: start Exasol
        run: |
          # Python UDFs need unprivileged user namespaces, which Ubuntu 23.10 and later restrict
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          docker run --name exasoldb -p 127.0.0.1:8563:8563 --detach --privileged --stop-timeout 120 \
            exasol/docker-db:2026.1.2
      - run: pip install -e ".[dev]"
      - name: wait until Exasol accepts a login
        run: |
          python - <<'EOF'
          import time, pyexasol
          t = time.time()
          while True:
              try:
                  c = pyexasol.connect(dsn="localhost:8563", user="sys", password="exasol", encryption=True,
                                       websocket_sslopt={"cert_reqs": 0})
                  print("Exasol", c.execute("SELECT PARAM_VALUE FROM EXA_METADATA WHERE PARAM_NAME = 'databaseProductVersion'").fetchval(),
                        f"accepts logins after {time.time() - t:.0f} s")
                  break
              except Exception as e:
                  if time.time() - t > 600:
                      raise SystemExit(f"Exasol did not accept a login in 10 minutes: {e}")
                  time.sleep(10)
          EOF
      - name: build the demo data on Exasol
        run: |
          receipts init --fresh
          receipts doctor
      - name: judge-check on Exasol
        run: receipts judge-check --backend exasol
      - name: live Exasol tests
        run: |
          receipts init --fresh
          RECEIPTS_LIVE_EXASOL=1 python -m pytest -q tests/test_exasol_live.py tests/test_failure_injection.py
      - name: audit-match, one run
        run: |
          receipts audit-match --out "$RUNNER_TEMP/AUDIT_MATCH.md"
          cat "$RUNNER_TEMP/AUDIT_MATCH.md" >> "$GITHUB_STEP_SUMMARY"
          python - <<'EOF'
          import json, os
          rep = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "AUDIT_MATCH.json")))["runs"][0]["gate"]
          print({k: rep[k] for k in ("issued", "matched", "different", "missing", "extra")})
          if rep["different"] or rep["missing"] or rep["matched"] != rep["issued"]:
              raise SystemExit("a statement Receipts sent is different or missing in the audit log")
          EOF
      - name: Exasol log on failure
        if: failure()
        run: docker logs --tail 200 exasoldb
